version: '3.8'

services:
  social-media-bot:
    build: .
    container_name: ai-social-media-bot
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    command: python daily_scheduler.py
    
  dashboard:
    build: .
    container_name: ai-social-media-dashboard
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "5000:5000"
    restart: unless-stopped
    command: python dashboard.py
